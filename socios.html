<!-- Tipografías de la marca. Si no hay internet, caen a las alternativas
     del sistema definidas en --serif y --sans. La app funciona igual. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   TOKENS DE DISEÑO — dirección 05 · BOUTIQUE
   Sale de 01_DISENO_SOCIOS_5_OPCIONES.html y de 01_INVESTIGACION_MARCA.pdf.
   Todo el color y toda la tipografía viven acá. No hay un solo valor suelto
   en el resto del archivo: cuando llegue la identidad final de la ONG, se
   cambian estas variables y cambia la app entera.
   ========================================================================== */
:root{
  /* --- Base --- */
  /* Negro suave de la marca, medido del archivo original. No es negro puro:
     el #000 sobre pantalla OLED corta demasiado contra el blanco. */
  --negro:#221F1F;
  --blanco:#ffffff;
  --texto:#1A1A1A;
  --texto-2:#6b6b6b;
  --texto-3:#8b8b8b;

  /* --- Acento: dorado de la marca ---
     El claro solo va sobre negro. Sobre fondo claro se usa el oscuro,
     porque el claro no llega al contraste mínimo y no se lee al sol. */
  --dorado:#B18D49;
  --dorado-oscuro:#7A5F2C;

  /* --- Líneas y campos --- */
  --linea:#E6E1D6;
  --linea-suave:#EFEBE2;
  --campo-bg:#F4F2ED;
  --campo-borde:#DFDAD0;

  /* --- Estados. Derivados de los lacres de la marca (rojo y verde),
         bajados de saturación para que se lean como aviso y no como adorno. --- */
  --ok:#2E6B4F;      --ok-bg:#EEF4F0;
  --err:#A31C1F;     --err-bg:#FBF0F0;
  --avi:#7A5F2C;     --avi-bg:#F7F2E8;
  --neu:#33383D;     --neu-bg:#F4F2ED;

  /* --- Tipografía. Serif solo de 19px para arriba: en cuerpo chico
         se rompe y cansa la vista en celular. --- */
  --serif:"Playfair Display", Georgia, "Times New Roman", serif;
  --sans:"Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  /* --- Medidas. Radio 0 en todo: la identidad no tiene una sola
         esquina redondeada. --- */
  --pad:20px;
  --nav-h:62px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--blanco);color:var(--texto);
  font-family:var(--sans);font-size:14px;font-weight:400;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit;border-radius:0}
input,textarea{font-family:inherit;font-size:16px;border-radius:0} /* 16px evita el zoom de iOS */
:focus-visible{outline:2px solid var(--dorado-oscuro);outline-offset:2px}

/* ===== Piezas tipográficas reutilizables ===== */
.rotulo{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.serif{font-family:var(--serif);font-weight:700}
.cifra{font-variant-numeric:tabular-nums}

/* ===== Íconos ===== */
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ico{width:1em;height:1em;flex:0 0 auto;display:inline-block;vertical-align:-.12em}

/* ===== Precio en tokens — un solo formato en toda la app ===== */
.tok{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;font-weight:600}
.tok .ico{color:var(--dorado-oscuro)}

/* ==========================================================================
   BOTONES
   ========================================================================== */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--negro);color:var(--blanco);
  padding:15px;font-size:11px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;text-align:center;
  transition:opacity .15s;
}
.btn:active{opacity:.82}
.btn:disabled{opacity:.32;cursor:not-allowed}
.btn-sec{background:transparent;color:var(--texto);border:1px solid var(--negro)}
.btn-linea{background:transparent;color:var(--texto-2);border:1px solid var(--linea)}
.btn-peligro{background:transparent;color:var(--err);border:1px solid var(--err)}
.btn-sm{width:auto;padding:11px 18px;font-size:10px}

/* ==========================================================================
   CAMPOS
   ========================================================================== */
.campo{margin-bottom:16px}
.campo label{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  font-weight:500;color:var(--texto-2);margin-bottom:7px}
.campo input,.campo textarea{
  width:100%;padding:13px;background:var(--campo-bg);
  border:1px solid var(--campo-borde);color:var(--texto);outline:none;resize:vertical;
}
.campo input:focus,.campo textarea:focus{outline:2px solid var(--negro);outline-offset:-2px}

/* ==========================================================================
   SELECTOR DE IDIOMA
   ========================================================================== */
.idioma{display:inline-flex;border:1px solid currentColor;flex:0 0 auto}
.idioma button{
  padding:5px 9px;font-size:9.5px;letter-spacing:.12em;font-weight:600;
  text-transform:uppercase;opacity:.55;
}
.idioma button[aria-pressed="true"]{opacity:1;background:currentColor}
.idioma button[aria-pressed="true"] span{mix-blend-mode:difference;color:#fff}

/* ==========================================================================
   LOGIN
   ========================================================================== */
#login{position:fixed;inset:0;background:var(--blanco);z-index:60;overflow-y:auto}
#login .marco{max-width:430px;margin:0 auto;min-height:100%}

#login .cabecera{
  background:var(--negro);color:var(--blanco);
  padding:calc(34px + env(safe-area-inset-top,0px)) 26px 40px;position:relative;
}
#login .idioma-pos{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:20px}

/* Logo oficial. Es el trazado vectorial del PDF de marca, no una imagen:
   se ve nítido en cualquier pantalla y toma el color del contenedor. */
#login .marca{text-align:center}
.lockup{width:100%;max-width:288px;height:auto;display:block;margin:0 auto;color:var(--dorado)}
#login .marca .bajada{
  font-size:9px;letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;
  color:rgba(255,255,255,.5);margin:22px 0 0;font-weight:500;
}
#login .marca .lema{
  font-family:var(--serif);font-weight:700;font-style:italic;
  font-size:12px;letter-spacing:.04em;color:rgba(255,255,255,.42);
  margin:9px 0 0;text-transform:none;
}
#login .form{padding:34px 26px 0}
#login-error{display:none;background:var(--err-bg);color:var(--err);
  border-left:2px solid var(--err);padding:12px 14px;font-size:12.5px;margin-bottom:18px}
#login .legal{text-align:center;font-size:10.5px;line-height:1.7;color:var(--texto-3);
  padding:26px 26px calc(30px + env(safe-area-inset-bottom,0px))}

/* ==========================================================================
   ESTRUCTURA DE LA APP
   ========================================================================== */
#app{display:none;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}

header{
  position:sticky;top:0;z-index:30;
  background:var(--negro);color:var(--blanco);
  padding:calc(14px + env(safe-area-inset-top,0px)) var(--pad) 14px;
}
header .fila{display:flex;align-items:center;gap:12px}
header .quien{flex:1;min-width:0}
header .club{display:flex;align-items:center;gap:7px;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:#c2c2c2;font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .club .ico{width:15px;height:15px;color:var(--dorado)}
header .club span{overflow:hidden;text-overflow:ellipsis}
header .nombre{font-size:14px;font-weight:500;margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .salir{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:#bdbdbd;font-weight:500;padding:6px 2px}
header .barra-saldo{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  border-top:1px solid rgba(255,255,255,.14);margin-top:13px;padding-top:13px;
}
header .barra-saldo .rotulo{color:#9a9a9a}
header .barra-saldo .tok{font-size:19px;color:var(--dorado)}
header .barra-saldo .tok .ico{color:var(--dorado)}

.screen{display:none;max-width:900px;margin:0 auto}
.screen.active{display:block}
.pad{padding:0 var(--pad)}

/* Encabezado de sección: título serif + filete dorado centrado */
.titulo-sec{padding:26px var(--pad) 18px;text-align:center}
.titulo-sec h1{font-family:var(--serif);font-weight:700;font-size:20px;
  letter-spacing:.2em;text-indent:.2em;text-transform:uppercase;margin:0}
.titulo-sec p{margin:9px 0 0;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--texto-3);font-weight:500}
.titulo-sec::after{content:"";display:block;height:1px;background:var(--dorado-oscuro);
  max-width:110px;margin:17px auto 0}

/* ==========================================================================
   CATÁLOGO
   ========================================================================== */
.colecciones{
  display:flex;gap:0;overflow-x:auto;padding:14px var(--pad) 0;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.colecciones::-webkit-scrollbar{display:none}
.coleccion{
  flex:0 0 auto;padding:9px 15px;border:1px solid var(--linea);margin-right:-1px;
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;
  color:var(--texto-2);white-space:nowrap;
}
.coleccion[aria-pressed="true"]{background:var(--negro);color:var(--blanco);border-color:var(--negro);position:relative;z-index:1}

.grid{display:grid;grid-template-columns:1fr;gap:24px;padding:0 var(--pad) 26px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr;gap:20px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}

.ficha{border:1px solid var(--linea);display:flex;flex-direction:column;text-align:left;width:100%}
.ficha .foto{
  aspect-ratio:4/3;background:var(--negro);position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.ficha .foto img{width:100%;height:100%;object-fit:cover;display:block}
/* Placeholder mientras no lleguen las fotos: el isotipo como marca de agua
   sobre negro. Deja el hueco ocupado con identidad en vez de con un cartel. */
.sin-foto{display:flex;flex-direction:column;align-items:center;gap:12px}
.sin-foto .ico{width:38px;height:38px;color:rgba(177,141,73,.4)}
.sin-foto span{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.26)}
.ficha .datos{padding:18px 18px 16px;flex:1;display:flex;flex-direction:column}
.ficha .datos h3{font-family:var(--serif);font-weight:700;font-size:19px;
  letter-spacing:.02em;line-height:1.25;margin:0}
.ficha .datos .sub{font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--texto-3);margin:7px 0 0;line-height:1.5}
.ficha .meta{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  border-top:1px solid var(--linea-suave);margin-top:14px;padding-top:13px}
.ficha .meta .tok{font-size:15px}
.ficha .estado{font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--texto-3);font-weight:500;white-space:nowrap}
.ficha.agotado .foto{opacity:.32}
.ficha.agotado .estado{color:var(--err);font-weight:600}

/* ==========================================================================
   AVISOS Y ESTADOS VACÍOS
   ========================================================================== */
.aviso{padding:13px 15px;font-size:12.5px;line-height:1.6;margin:16px 0;border-left:2px solid}
.aviso.err{background:var(--err-bg);color:var(--err);border-color:var(--err)}
.aviso.avi{background:var(--avi-bg);color:var(--avi);border-color:var(--avi)}
.aviso.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.aviso.neu{background:var(--neu-bg);color:var(--neu);border-color:var(--neu)}

.vacio{text-align:center;padding:60px var(--pad)}
.vacio .ico{font-size:26px;color:var(--linea);margin-bottom:16px}
.vacio p{margin:0 0 20px;font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--texto-3);font-weight:500}
.vacio .btn-sm{margin:0 auto}
.cargando{text-align:center;padding:48px var(--pad);font-size:10px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--texto-3);font-weight:500}

/* ==========================================================================
   CARRITO
   ========================================================================== */
.renglon{display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--linea-suave);padding:16px 0}
.renglon:first-child{border-top:1px solid var(--linea-suave)}
.renglon .info{flex:1;min-width:0}
.renglon .info h4{font-family:var(--serif);font-weight:700;font-size:16px;margin:0;line-height:1.25}
.renglon .info .sub{font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--texto-3);margin-top:5px}
.renglon .info .tok{font-size:13px;margin-top:6px}
.cant{display:flex;align-items:center;border:1px solid var(--linea)}
.cant button{width:32px;height:32px;font-size:15px;font-weight:500;color:var(--texto)}
.cant button:disabled{opacity:.25}
.cant .n{min-width:26px;text-align:center;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}

.cuenta{border-top:1px solid var(--negro);margin-top:22px;padding-top:16px}
.cuenta .linea{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0}
.cuenta .linea .rotulo{color:var(--texto-2)}
.cuenta .linea.total{border-top:1px solid var(--linea);margin-top:10px;padding-top:14px}
.cuenta .linea.total .rotulo{color:var(--texto);font-weight:600}
.cuenta .linea.total .tok{font-size:20px}

/* ==========================================================================
   PEDIDOS
   ========================================================================== */
.pedido{border:1px solid var(--linea);margin-bottom:16px}
.pedido .cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px 14px}
.pedido .cab .num{font-family:var(--serif);font-weight:700;font-size:18px;line-height:1}
.pedido .cab .fecha{font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--texto-3);margin-top:7px;font-weight:500}
.marca-estado{font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;
  padding:5px 9px;border:1px solid currentColor;white-space:nowrap}
.marca-estado.e-neu{color:var(--texto-2)}
.marca-estado.e-ok{color:var(--ok)}
.marca-estado.e-avi{color:var(--avi)}
.marca-estado.e-err{color:var(--err)}
.pedido .items{border-top:1px solid var(--linea-suave);padding:14px 18px;font-size:12px}
.pedido .items div{display:flex;justify-content:space-between;gap:12px;padding:3px 0;color:var(--texto-2)}
.pedido .items div .cifra{color:var(--texto)}
.pedido .pie{display:flex;justify-content:space-between;align-items:center;gap:12px;
  border-top:1px solid var(--linea-suave);padding:14px 18px}
.pedido .pie .tok{font-size:16px}
.pedido .nota{border-top:1px solid var(--linea-suave);padding:12px 18px;
  font-size:11.5px;color:var(--texto-3);font-style:italic}

/* ==========================================================================
   TOKENS
   ========================================================================== */
.panel-saldo{background:var(--negro);color:var(--blanco);padding:34px 22px;text-align:center;margin-bottom:26px}
.panel-saldo .rotulo{color:#9a9a9a}
.panel-saldo .monto{display:flex;align-items:center;justify-content:center;gap:10px;
  font-size:42px;font-weight:600;letter-spacing:-.02em;margin-top:10px;
  color:var(--dorado);font-variant-numeric:tabular-nums}
.panel-saldo .monto .ico{width:.62em;height:.62em}
.panel-saldo .unidad{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;
  color:#9a9a9a;margin-top:10px;font-weight:500}

.bloque{border:1px solid var(--linea);padding:20px;margin-bottom:22px}
.bloque h3{font-family:var(--serif);font-weight:700;font-size:17px;margin:0 0 6px}
.bloque .bajada{font-size:12px;color:var(--texto-3);line-height:1.6;margin:0 0 16px}
.canje{display:flex;gap:0}
.canje input{flex:1;text-transform:uppercase;letter-spacing:.14em;font-weight:600;border-right:none}
.canje .btn{width:auto;padding:13px 20px;flex:0 0 auto}

.mov{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--linea-suave)}
.mov:last-child{border-bottom:none}
.mov .signo{width:28px;height:28px;border:1px solid currentColor;display:flex;
  align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:0 0 auto}
.mov .signo.mas{color:var(--ok)}
.mov .signo.menos{color:var(--texto-2)}
.mov .info{flex:1;min-width:0}
.mov .info .q{font-size:12.5px;font-weight:500}
.mov .info .f{font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--texto-3);margin-top:3px;line-height:1.5}
.mov .n{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mov .n.mas{color:var(--ok)}
.mov .n.menos{color:var(--texto)}

/* ==========================================================================
   PEDIDO CONFIRMADO
   ========================================================================== */
#s-exito .sello{
  width:92px;height:92px;margin:44px auto 26px;border:1px solid var(--dorado-oscuro);
  display:flex;align-items:center;justify-content:center;color:var(--dorado-oscuro);
  animation:aparecer .4s ease-out;
}
#s-exito .sello .ico{width:38px;height:38px}
@keyframes aparecer{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
#s-exito .centro{text-align:center;padding:0 var(--pad)}
#s-exito h2{font-family:var(--serif);font-weight:700;font-size:22px;
  letter-spacing:.14em;text-indent:.14em;text-transform:uppercase;margin:0}
#s-exito .num{font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--texto-3);margin-top:12px;font-weight:500}
#s-exito .detalle{border:1px solid var(--linea);padding:18px;margin:28px 0 24px;text-align:left}
#s-exito .detalle .linea{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0}
#s-exito .detalle .linea .rotulo{color:var(--texto-2)}

/* ==========================================================================
   NAVEGACIÓN INFERIOR
   ========================================================================== */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--blanco);border-top:1px solid var(--linea);
  display:flex;padding-bottom:env(safe-area-inset-bottom,0px);
}
nav button{
  flex:1;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  color:var(--texto-3);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;
  font-weight:500;position:relative;
}
nav button .ico{width:19px;height:19px}
nav button[aria-current="page"]{color:var(--texto)}
nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--negro)}
nav .contador{
  position:absolute;top:11px;left:50%;margin-left:6px;
  background:var(--dorado-oscuro);color:var(--blanco);
  font-size:9px;font-weight:600;min-width:16px;height:16px;
  display:none;align-items:center;justify-content:center;padding:0 4px;
}

/* ==========================================================================
   MODALES
   ========================================================================== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;
  display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
@media(min-width:620px){.overlay.open{align-items:center}}
.hoja{background:var(--blanco);width:100%;max-width:430px;max-height:90vh;overflow-y:auto;
  padding-bottom:env(safe-area-inset-bottom,0px);animation:subir .24s ease-out}
@media(min-width:620px){.hoja{margin:20px;animation:none}}
@keyframes subir{from{transform:translateY(100%)}to{transform:translateY(0)}}
.hoja .foto-modal{aspect-ratio:16/9;background:var(--negro);display:flex;
  align-items:center;justify-content:center;overflow:hidden}
.hoja .foto-modal img{width:100%;height:100%;object-fit:cover}

.hoja .cuerpo{padding:22px var(--pad) 20px}
.hoja h2{font-family:var(--serif);font-weight:700;font-size:22px;margin:0;line-height:1.2}
.hoja .sub{font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--texto-3);margin:9px 0 0}
.hoja .desc{font-size:13px;color:var(--texto-2);line-height:1.65;margin:16px 0 0}
.hoja .fila-precio{display:flex;align-items:center;justify-content:space-between;gap:14px;
  border-top:1px solid var(--linea);border-bottom:1px solid var(--linea);
  padding:16px 0;margin:20px 0}
.hoja .fila-precio .tok{font-size:17px}
.hoja .fila-precio .disp{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--texto-3);margin-top:5px;font-weight:500}
.hoja .acciones{display:flex;gap:10px;margin-top:12px}
.hoja .acciones .btn{flex:1}

/* ===== Aviso flotante ===== */
#toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(16px);
  bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));
  background:var(--negro);color:var(--blanco);
  padding:13px 20px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  font-weight:500;z-index:70;opacity:0;pointer-events:none;transition:.22s;
  max-width:86%;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== Cinta de modo demo ===== */
#cinta-demo{background:var(--avi-bg);color:var(--avi);text-align:center;
  font-size:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;padding:6px}

@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>

      <div id="login-error"></div>
      <div class="campo">
        <label for="in-usuario" data-t="usuario">Usuario</label>
        <input id="in-usuario" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" data-tph="usuario_ph">
      </div>
      <div class="campo">
        <label for="in-pass" data-t="contrasena">Contraseña</label>
        <input id="in-pass" type="password" autocomplete="current-password" data-tph="contrasena_ph">
      </div>

    </div>

<!-- =========================== APP =========================== -->
<div id="app">

  <div id="cinta-demo" data-t="cinta_demo">Modo demo</div>

  <header>
    <div class="fila">
      <div class="quien">
        <div class="club"><svg class="ico"><use href="#i-cruz"/></svg><span id="h-club">HOUSE OF AFICIONADO</span></div>
        <div class="nombre" id="h-nombre">—</div>
      </div>
      <div class="idioma" id="idioma-app">
        <button data-idioma="es" aria-pressed="true"><span>ES</span></button>
        <button data-idioma="en" aria-pressed="false"><span>EN</span></button>
      </div>
      <button class="salir" id="btn-salir" data-t="salir">Salir</button>
    </div>
    <div class="barra-saldo">
      <div class="rotulo" data-t="tu_saldo">Tu saldo</div>
      <div class="tok"><svg class="ico"><use href="#i-token"/></svg><span id="h-saldo" class="cifra">0</span></div>
    </div>
  </header>

  <!-- ---------- CATÁLOGO ---------- -->
  <div class="screen active" id="s-catalogo">
    <div class="colecciones" id="colecciones"></div>
    <div class="titulo-sec" id="titulo-coleccion"><h1></h1><p></p></div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- ---------- CARRITO ---------- -->
  <div class="screen" id="s-carrito">
    <div class="titulo-sec"><h1 data-t="tu_pedido">Tu pedido</h1></div>
    <div class="pad" id="carrito-cont"></div>
  </div>

  <!-- ---------- PEDIDOS ---------- -->
  <div class="screen" id="s-pedidos">
    <div class="titulo-sec"><h1 data-t="mis_pedidos">Mis pedidos</h1></div>
    <div class="pad" id="pedidos-cont"></div>
  </div>

  <!-- ---------- TOKENS ---------- -->
  <div class="screen" id="s-tokens">
    <div class="titulo-sec"><h1 data-t="mis_tokens">Mis tokens</h1></div>

    <div class="pad">
      <div class="panel-saldo">
        <div class="rotulo" data-t="saldo_disponible">Saldo disponible</div>
        <div class="monto"><svg class="ico"><use href="#i-token"/></svg><span id="t-saldo">0</span></div>
        <div class="unidad" data-t="tokens_unidad">Tokens</div>
      </div>

      <div class="bloque">
        <h3 data-t="canjear_codigo">Canjear un código</h3>
        <p class="bajada" data-t="canjear_bajada"></p>
        <div class="canje">
          <input id="in-codigo" type="text" autocapitalize="characters" spellcheck="false" data-tph="codigo_ph">
          <button class="btn" id="btn-canjear" data-t="canjear">Canjear</button>
        </div>
        <div id="canje-msg"></div>
      </div>

      <div class="bloque">
        <h3 data-t="movimientos">Movimientos</h3>
        <p class="bajada" data-t="movimientos_bajada"></p>
        <div id="movs-cont"></div>
      </div>
    </div>
  </div>

  <!-- ---------- PEDIDO CONFIRMADO ---------- -->
  <div class="screen" id="s-exito">
    <div class="sello"><svg class="ico"><use href="#i-cruz"/></svg></div>
    <div class="centro">
      <h2 data-t="pedido_confirmado">Pedido confirmado</h2>
      <div class="num" id="exito-num"></div>
      <div class="detalle">
        <div class="linea"><span class="rotulo" data-t="total_pedido">Total del pedido</span>
          <span class="tok"><svg class="ico"><use href="#i-token"/></svg><span id="exito-total"></span></span></div>
        <div class="linea"><span class="rotulo" data-t="saldo_restante">Saldo restante</span>
          <span class="tok"><svg class="ico"><use href="#i-token"/></svg><span id="exito-saldo"></span></span></div>
      </div>
      <button class="btn" onclick="ir('pedidos')" data-t="ver_pedidos">Ver mis pedidos</button>
      <button class="btn btn-sec" style="margin-top:10px;margin-bottom:30px" onclick="ir('catalogo')" data-t="volver_catalogo">Volver al catálogo</button>
    </div>
  </div>

  <nav>
    <button data-nav="catalogo" aria-current="page" onclick="ir('catalogo')">
      <svg class="ico"><use href="#i-catalogo"/></svg><span data-t="nav_catalogo">Catálogo</span></button>
    <button data-nav="carrito" onclick="ir('carrito')">
      <svg class="ico"><use href="#i-carrito"/></svg><span data-t="nav_carrito">Carrito</span>
      <span class="contador" id="contador">0</span></button>
    <button data-nav="pedidos" onclick="ir('pedidos')">
      <svg class="ico"><use href="#i-pedidos"/></svg><span data-t="nav_pedidos">Pedidos</span></button>
    <button data-nav="tokens" onclick="ir('tokens')">
      <svg class="ico"><use href="#i-token"/></svg><span data-t="nav_tokens">Tokens</span></button>
  </nav>

/* t() devuelve el texto en el idioma activo y reemplaza los huecos {0}, {1}… */
function t(clave){
  var txt = (TEXTOS[IDIOMA] && TEXTOS[IDIOMA][clave]);
  if (txt === undefined) txt = (TEXTOS.es[clave] !== undefined ? TEXTOS.es[clave] : clave);
  for (var i = 1; i < arguments.length; i++) {
    txt = txt.split("{" + (i - 1) + "}").join(arguments[i]);
  }
  return txt;
}

function _hace(dias, horas){
  var d = new Date();
  d.setDate(d.getDate() - (dias || 0));
  d.setHours(d.getHours() - (horas || 0));
  return d.toISOString();
}


/* ==========================================================================
   ERRORES DE LA BASE
   Las funciones de Postgres avisan los problemas con códigos cortos
   (CREDENCIALES, SIN_STOCK:Flor Índica). Acá se traducen al idioma activo.
   Si aparece un código que no conocemos, se muestra un mensaje general:
   nunca el error crudo de la base.
   ========================================================================== */
function traducirError(codigo){
  if (!codigo) return t("err_servidor");
  var partes = String(codigo).split(":");
  var clave = partes[0].trim();
  var dato = partes.slice(1).join(":");

  var mapa = {
    CREDENCIALES:"err_credenciales", SIN_ACCESO:"err_inactivo",
    DEMASIADOS_INTENTOS:"err_demasiados", SESION_INVALIDA:"err_sesion",
    SALDO_INSUFICIENTE:"err_saldo_cambio", SIN_STOCK:"err_sin_stock",
    CARRITO_VACIO:"err_carrito_vacio", PEDIDOS_CERRADOS:"err_pedidos_cerrados",
    PRODUCTO_INEXISTENTE:"err_producto_ya_no",
    PEDIDO_INEXISTENTE:"err_cancelar", PEDIDO_EN_CURSO:"err_pedido_en_curso",
    CODIGO_INEXISTENTE:"err_codigo_no_existe", CODIGO_USADO:"err_codigo_usado",
    CODIGO_VENCIDO:"err_codigo_vencido",
    CANTIDAD_INVALIDA:"err_confirmar", PASSWORD_CORTA:"err_pass_corta"
  };

  if (mapa[clave]) return dato ? t(mapa[clave], dato) : t(mapa[clave]);
  return t("err_servidor");
}


/* ==========================================================================
   rpc() — ÚNICO PUNTO DE CONTACTO CON LA BASE
   La app ya no lee ni escribe tablas: llama funciones. Cada llamada viaja
   con el token de la sesión y la base decide qué puede ver y hacer este socio.
   ========================================================================== */
var TOKEN = null;

async function rpc(fn, params){
  if (MODO_DEMO) return demoRPC(fn, params || {});

  var r;
  try {
    r = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(params || {})
    });
  } catch(e) {
    throw new Error(t("err_red"));
  }

  if (!r.ok) {
    var detalle = "";
    try {
      var j = await r.json();
      detalle = j.message || j.hint || j.details || "";
    } catch(e) { detalle = ""; }

    if (detalle.indexOf("SESION_INVALIDA") >= 0) sesionCaida();
    throw new Error(traducirError(limpiarCodigo(detalle)));
  }

  if (r.status === 204) return null;
  var txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}

function limpiarCodigo(msg){
  var m = String(msg || "").match(/[A-Z_]{4,}(:[^"']*)?/);
  return m ? m[0] : "";
}

function sesionCaida(){
  TOKEN = null;
  try { sessionStorage.removeItem(CLAVE_SESION); } catch(e){}
  setTimeout(function(){ location.reload(); }, 1800);
}

  return nuevo;
}

async function demoRPC(fn, p){
  await new Promise(function(r){ setTimeout(r, 110); });

  if (fn === "fn_socio_login") {
    var u = String(p.p_usuario || "").trim().toLowerCase();
    if (u !== DEMO.socio.usuario || p.p_password !== DEMO.socio.password) demoError("CREDENCIALES");
    if (DEMO.socio.estado !== "activo") demoError("SIN_ACCESO");
    _demoDentro = true;
    return { token:"demo-token-0123456789012345678901234567890123456789",
             id:DEMO.socio.id, nombre:DEMO.socio.nombre, apellido:DEMO.socio.apellido,
             saldo_tokens:DEMO.socio.saldo_tokens };
  }

  if (fn === "fn_socio_logout") { _demoDentro = false; return null; }

  if (!_demoDentro) demoError("SESION_INVALIDA");

  if (fn === "fn_socio_datos") {
    return {
      socio: JSON.parse(JSON.stringify(DEMO.socio)),
      configuracion: JSON.parse(JSON.stringify(DEMO.configuracion)),
      productos: JSON.parse(JSON.stringify(DEMO.productos)),
      pedidos: JSON.parse(JSON.stringify(DEMO.pedidos)),
      movimientos: JSON.parse(JSON.stringify(DEMO.movimientos))
    };
  }

  if (fn === "fn_socio_imagenes") return {};

  if (fn === "fn_socio_pedido") {
    if (DEMO.configuracion.pedidos_activos !== "true") demoError("PEDIDOS_CERRADOS");
    var items = p.p_items || [];
    if (!items.length) demoError("CARRITO_VACIO");

    var total = 0, detalle = [];
    items.forEach(function(i){
      var pr = DEMO.productos.filter(function(x){ return x.id === Number(i.producto_id); })[0];
      if (!pr) demoError("PRODUCTO_INEXISTENTE");
      if (pr.stock < i.cantidad) demoError("SIN_STOCK:" + pr.nombre);
      pr.stock -= i.cantidad;
      total += pr.precio_tokens * i.cantidad;
      detalle.push({ producto_id:pr.id, nombre:pr.nombre, cantidad:i.cantidad,
                     precio_tokens:pr.precio_tokens, subtotal:pr.precio_tokens * i.cantidad });
    });

    if (total > DEMO.socio.saldo_tokens) {
      /* Igual que en la base: si el saldo no alcanza, se deshace todo. */
      detalle.forEach(function(i){
        var pr = DEMO.productos.filter(function(x){ return x.id === i.producto_id; })[0];
        if (pr) pr.stock += i.cantidad;
      });
      demoError("SALDO_INSUFICIENTE");
    }

    var ped = { id:_demoProxId(DEMO.pedidos), socio_id:DEMO.socio.id,
                socio_nombre:DEMO.socio.nombre + " " + DEMO.socio.apellido,
                items:detalle, total_tokens:total, estado:"pendiente",
                nota:p.p_nota || null, created_at:new Date().toISOString(),
                entregado_en:null, cancelado_en:null };
    DEMO.pedidos.unshift(ped);
    _demoMover("consumo_pedido", -total, null, ped.id, null);
    return { id:ped.id, total:total };
  }

  if (fn === "fn_socio_pedido_cancelar") {
    var pc = DEMO.pedidos.filter(function(x){ return String(x.id) === String(p.p_pedido_id); })[0];
    if (!pc) demoError("PEDIDO_INEXISTENTE");
    if (pc.estado !== "pendiente") demoError("PEDIDO_EN_CURSO");
    pc.estado = "cancelado";
    pc.cancelado_en = new Date().toISOString();
    _demoMover("devolucion_pedido", pc.total_tokens, null, pc.id, "Cancelado por el socio");
    (pc.items || []).forEach(function(i){
      var pr = DEMO.productos.filter(function(x){ return x.id === i.producto_id; })[0];
      if (pr) pr.stock += i.cantidad;
    });
    return null;
  }

  if (fn === "fn_socio_canjear") {
    var cod = String(p.p_codigo || "").trim().toUpperCase();
    var c = DEMO.codigos.filter(function(x){ return x.codigo === cod; })[0];
    if (!c) demoError("CODIGO_INEXISTENTE");
    if (c.usado) demoError("CODIGO_USADO");
    c.usado = true;
    var saldo = _demoMover("canje_codigo", c.tokens, "Código " + c.codigo, c.id, null);
    return { tokens:c.tokens, saldo:saldo };
  }

  return null;
}

/* ==========================================================================
   UTILIDADES
   ========================================================================== */
function $(id){ return document.getElementById(id); }

/* Números: en español el separador de miles es el punto, en inglés la coma. */
function num(n){ return Number(n || 0).toLocaleString(IDIOMA === "es" ? "es-AR" : "en-US"); }

function nroPedido(id){ return "#" + String(id).padStart(4, "0"); }

/* Precio en tokens. Un solo formato para toda la app: moneda + cifra. */
function tokHTML(n, clase){
  return '<span class="tok' + (clase ? " " + clase : "") + '">' +
         '<svg class="ico"><use href="#i-token"/></svg>' +
         '<span class="cifra">' + num(n) + '</span></span>';
}

/* Fechas: cada idioma las escribe distinto. */
function fecha(iso){
  if (!iso) return "";
  var d = new Date(iso);
  var hoy = new Date();
  var hh = String(d.getHours()).padStart(2, "0");
  var mm = String(d.getMinutes()).padStart(2, "0");

  if (d.toDateString() === hoy.toDateString()) {
    if (IDIOMA === "es") return t("hoy") + " " + hh + ":" + mm;
    return t("hoy") + " " + d.toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit" });
  }
  if (IDIOMA === "es") {
    return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") +
           "/" + d.getFullYear() + " " + hh + ":" + mm;
  }
  return d.toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }) + " " +
         d.toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit" });
}

function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* Etiqueta de una colección. Si la categoría no está en el diccionario
   (por ejemplo, una nueva que cargó el admin), se muestra tal cual vino
   de la base. Así nunca queda una colección sin nombre. */
function etiquetaColeccion(cat){
  var clave = "c_" + cat;
  var txt = TEXTOS[IDIOMA][clave];
  return txt !== undefined ? txt : cat;
}

function etiquetaEstado(e){ return t("e_" + e); }

var toastId = null;
function toast(msg){
  var el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastId);
  toastId = setTimeout(function(){ el.classList.remove("show"); }, 2800);
}

function abrirModal(id){ $(id).classList.add("open"); }
function cerrarModal(id){ $(id).classList.remove("open"); }

var confirmCB = null;
function confirmar(titulo, texto, cb){
  $("mc-titulo").textContent = titulo;
  $("mc-texto").textContent = texto;
  confirmCB = cb;
  abrirModal("modal-confirm");
}
$("mc-si").onclick = function(){
  cerrarModal("modal-confirm");
  if (confirmCB) confirmCB();
  confirmCB = null;
};

["modal-prod","modal-confirm"].forEach(function(id){
  $(id).addEventListener("click", function(e){ if (e.target === this) cerrarModal(id); });
});


/* ==========================================================================
   IDIOMA
   Se guarda en el celular del socio. Cambiarlo no recarga la página ni
   toca el carrito: solo repinta lo que está en pantalla.
   ========================================================================== */
function cambiarIdioma(nuevo){
  if (nuevo !== "es" && nuevo !== "en") return;
  IDIOMA = nuevo;
  try { localStorage.setItem(CLAVE_IDIOMA, nuevo); } catch(e){}
  aplicarIdioma();
}

function aplicarIdioma(){
  document.documentElement.lang = IDIOMA;

  /* Textos fijos del HTML */
  document.querySelectorAll("[data-t]").forEach(function(el){
    el.innerHTML = t(el.getAttribute("data-t"));
  });
  document.querySelectorAll("[data-tph]").forEach(function(el){
    el.setAttribute("placeholder", t(el.getAttribute("data-tph")));
  });

  /* Botones del selector */
  document.querySelectorAll(".idioma button").forEach(function(b){
    b.setAttribute("aria-pressed", b.getAttribute("data-idioma") === IDIOMA ? "true" : "false");
  });

  document.title = CLUB_NOMBRE + " — " + t("panel_socios");
  if (MODO_DEMO) $("login-ayuda").innerHTML = t("demo_ayuda");

  /* Lo que se dibuja por JavaScript hay que repintarlo */
  if (socio) {
    pintarSaldo();
    pintarColecciones();
    pintarProductos();
    if (pantalla === "carrito") pintarCarrito();
    if (pantalla === "pedidos") cargarPedidos();
    if (pantalla === "tokens")  cargarTokens();
    if (modalProd && $("modal-prod").classList.contains("open")) pintarModalProd();
  }
}

document.querySelectorAll(".idioma button").forEach(function(b){
  b.onclick = function(){ cambiarIdioma(b.getAttribute("data-idioma")); };
});


/* ==========================================================================
   LOGIN Y SESIÓN
   ========================================================================== */
/* El token vive en sessionStorage: se borra solo al cerrar el navegador.
   Además vence a las 12 horas del lado de la base. */
var CLAVE_SESION = "hoa_socio_token";

/* Todo lo que la app sabe se trae de una sola llamada. La base devuelve
   únicamente lo de este socio: no existe forma de pedirle los datos de otro. */
var pedidosCache = [];
var movsCache    = [];

async function sincronizar(){
  var d = await rpc("fn_socio_datos", { p_token:TOKEN });

  socio        = d.socio;
  productos    = d.productos || [];
  pedidosCache = d.pedidos || [];
  movsCache    = d.movimientos || [];
  config       = d.configuracion || {};

  pintarSaldo();
  await traerFotos();
  return d;
}

/* Las fotos se piden aparte y una sola vez: si vinieran junto con el catálogo,
   abrir la app descargaría todas las imágenes aunque no se vean. */
var cacheFotos = {};

async function traerFotos(){
  var faltan = productos.filter(function(p){ return p.tiene_imagen && !cacheFotos[p.id]; })
                        .map(function(p){ return p.id; });

  productos.forEach(function(p){ if (cacheFotos[p.id]) p.imagen_url = cacheFotos[p.id]; });
  if (!faltan.length) return;

  try {
    var r = await rpc("fn_socio_imagenes", { p_token:TOKEN, p_ids:faltan });
    Object.keys(r || {}).forEach(function(id){ cacheFotos[id] = r[id]; });
    productos.forEach(function(p){ if (cacheFotos[p.id]) p.imagen_url = cacheFotos[p.id]; });
  } catch(e) { /* si no se pueden traer, se muestra el recuadro sin foto */ }
}

async function entrar(){
  var u = $("in-usuario").value.trim();
  var p = $("in-pass").value;
  $("login-error").style.display = "none";

  if (!u || !p) { errorLogin(t("err_campos")); return; }

  var btn = $("btn-entrar");
  btn.disabled = true; btn.textContent = t("entrando");

  try {
    var r = await rpc("fn_socio_login", { p_usuario:u.toLowerCase(), p_password:p });
    TOKEN = r.token;
    try { sessionStorage.setItem(CLAVE_SESION, TOKEN); } catch(e){}
    $("in-pass").value = "";
    await abrirApp();
  } catch(e){
    errorLogin(e.message || t("err_conexion"));
  } finally {
    btn.disabled = false; btn.textContent = t("entrar");
  }
}

function errorLogin(msg){
  var el = $("login-error");
  el.textContent = msg;
  el.style.display = "block";
}

function salir(){
  confirmar(t("salir_titulo"), t("salir_texto"), async function(){
    try { await rpc("fn_socio_logout", { p_token:TOKEN }); } catch(e){}
    try { sessionStorage.removeItem(CLAVE_SESION); } catch(e){}
    TOKEN = null;
    socio = null; carrito = []; cacheFotos = {};
    actualizarContador();
    $("app").style.display = "none";
    $("login").style.display = "block";
    $("in-pass").value = "";
  });
}

async function abrirApp(){
  $("login").style.display = "none";
  $("app").style.display = "block";

  await sincronizar();

  if (config.club_nombre) CLUB_NOMBRE = config.club_nombre;
  $("h-club").textContent = CLUB_NOMBRE;
  $("h-nombre").textContent = socio.nombre + (socio.apellido ? " " + socio.apellido : "");

  pintarColecciones();
  pintarProductos();
  ir("catalogo");
}

function pintarSaldo(){
  if (!socio) return;
  $("h-saldo").textContent = num(socio.saldo_tokens);
  $("t-saldo").textContent = num(socio.saldo_tokens);
}

/* Relee todo desde la base antes de operar, por si el club cargó o descontó
   tokens, o cambió el stock, mientras la app estaba abierta. */
async function refrescarSocio(){
  await sincronizar();
}


/* ==========================================================================
   NAVEGACIÓN
   ========================================================================== */
function ir(destino){
  pantalla = destino;
  document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("active"); });
  var el = $("s-" + destino);
  if (el) el.classList.add("active");

  document.querySelectorAll("nav button").forEach(function(b){
    if (b.getAttribute("data-nav") === destino) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });

  window.scrollTo(0, 0);

  if (destino === "carrito") pintarCarrito();
  if (destino === "pedidos") cargarPedidos();
  if (destino === "tokens")  cargarTokens();
}


/* ==========================================================================
   CATÁLOGO
   ========================================================================== */
async function cargarCatalogo(){
  $("grid").innerHTML = '<div class="cargando">' + t("cargando") + '</div>';
  try {
    await sincronizar();
  } catch(e){
    $("grid").innerHTML = '<div class="aviso err" style="margin:0 var(--pad)">' + t("err_catalogo") + '</div>';
    return;
  }
  pintarColecciones();
  pintarProductos();
}

function pintarColecciones(){
  if (!productos.length) return;

  var cats = [];
  productos.forEach(function(p){ if (cats.indexOf(p.categoria) < 0) cats.push(p.categoria); });
  if (!catActual || cats.indexOf(catActual) < 0) catActual = cats[0] || null;

  $("colecciones").innerHTML = cats.map(function(c){
    return '<button class="coleccion" data-cat="' + esc(c) + '" aria-pressed="' +
           (c === catActual ? "true" : "false") + '">' + esc(etiquetaColeccion(c)) + '</button>';
  }).join("");

  document.querySelectorAll("#colecciones .coleccion").forEach(function(b){
    b.onclick = function(){
      catActual = b.getAttribute("data-cat");
      pintarColecciones();
      pintarProductos();
    };
  });
}

function pintarProductos(){
  if (!catActual) return;

  var lista = productos.filter(function(p){ return p.categoria === catActual; });
  var cab = $("titulo-coleccion");
  cab.querySelector("h1").textContent = etiquetaColeccion(catActual);
  cab.querySelector("p").textContent = lista.length === 1 ? t("pieza", 1) : t("piezas", lista.length);

  if (!lista.length) {
    $("grid").innerHTML = '<div class="vacio"><p>' + t("coleccion_vacia") + '</p></div>';
    return;
  }

  $("grid").innerHTML = lista.map(function(p){
    var libre = p.stock - cantidadEnCarrito(p.id);
    var estado = libre <= 0 ? t("no_disponible")
               : (libre <= 5 ? t("quedan", libre) : t("disponible"));

    var foto = p.imagen_url
      ? '<img src="' + esc(p.imagen_url) + '" alt="' + esc(p.nombre) + '">'
      : '<div class="sin-foto"><svg class="ico"><use href="#i-cruz"/></svg><span>' + t("sin_foto") + '</span></div>';

    return '<button class="ficha' + (libre <= 0 ? ' agotado' : '') + '" data-id="' + p.id + '">' +
             '<div class="foto">' + foto + '</div>' +
             '<div class="datos">' +
               '<h3>' + esc(p.nombre) + '</h3>' +
               '<p class="sub">' + esc(p.descripcion || "") + '</p>' +
               '<div class="meta">' + tokHTML(p.precio_tokens) +
                 '<span class="estado">' + estado + '</span>' +
               '</div>' +
             '</div>' +
           '</button>';
  }).join("");

  document.querySelectorAll(".ficha").forEach(function(b){
    b.onclick = function(){ abrirProducto(Number(b.getAttribute("data-id"))); };
  });
}

function abrirProducto(id){
  var p = productos.filter(function(x){ return x.id === id; })[0];
  if (!p) return;
  modalProd = p;
  modalQty = 1;
  pintarModalProd();
  abrirModal("modal-prod");
}

function pintarModalProd(){
  var p = modalProd;
  var libre = p.stock - cantidadEnCarrito(p.id);

  $("mp-foto").innerHTML = p.imagen_url
    ? '<img src="' + esc(p.imagen_url) + '" alt="' + esc(p.nombre) + '">'
    : '<div class="sin-foto"><svg class="ico"><use href="#i-cruz"/></svg><span>' + t("sin_foto") + '</span></div>';

  $("mp-nombre").textContent = p.nombre;
  $("mp-sub").textContent = p.descripcion || "";
  $("mp-precio").textContent = num(p.precio_tokens);

  $("mp-qty").textContent = modalQty;
  $("mp-menos").disabled = modalQty <= 1;
  $("mp-mas").disabled   = modalQty >= libre;

  $("mp-stock").textContent = libre <= 0 ? t("no_disponible")
                            : (libre === 1 ? t("unidad_disp") : t("unidades_disp", libre));

  var costo = p.precio_tokens * modalQty;
  var aviso = "";
  if (libre <= 0) aviso = '<div class="aviso err">' + t("agotado_texto") + '</div>';
  else if (costo > saldoDisponible()) aviso = '<div class="aviso avi">' + t("saldo_no_alcanza", num(saldoDisponible())) + '</div>';
  $("mp-aviso").innerHTML = aviso;

  var btn = $("mp-agregar");
  btn.disabled = libre <= 0;
  btn.textContent = libre <= 0 ? t("no_disponible") : t("agregar", num(costo));
}

$("mp-menos").onclick = function(){ if (modalQty > 1) { modalQty--; pintarModalProd(); } };
$("mp-mas").onclick = function(){
  var libre = modalProd.stock - cantidadEnCarrito(modalProd.id);
  if (modalQty < libre) { modalQty++; pintarModalProd(); }
};

$("mp-agregar").onclick = function(){
  var p = modalProd;
  var existente = carrito.filter(function(i){ return i.producto_id === p.id; })[0];

  if (existente) existente.cantidad += modalQty;
  else carrito.push({
    producto_id:p.id, nombre:p.nombre,
    precio_tokens:p.precio_tokens, cantidad:modalQty, stock:p.stock
  });

  cerrarModal("modal-prod");
  actualizarContador();
  pintarProductos();
  toast(t("agregado", modalQty, p.nombre));
};


/* ==========================================================================
   CARRITO
   ========================================================================== */
function cantidadEnCarrito(pid){
  var i = carrito.filter(function(x){ return x.producto_id === pid; })[0];
  return i ? i.cantidad : 0;
}

function totalCarrito(){
  return carrito.reduce(function(a, i){ return a + i.precio_tokens * i.cantidad; }, 0);
}

/* Tokens que todavía no están comprometidos en el carrito */
function saldoDisponible(){
  return (socio ? socio.saldo_tokens : 0) - totalCarrito();
}

function actualizarContador(){
  var n = carrito.reduce(function(a, i){ return a + i.cantidad; }, 0);
  var el = $("contador");
  el.textContent = n;
  el.style.display = n > 0 ? "flex" : "none";
}

function pintarCarrito(){
  var cont = $("carrito-cont");

  if (!carrito.length) {
    cont.innerHTML =
      '<div class="vacio">' +
        '<div class="ico"><svg width="26" height="26"><use href="#i-carrito"/></svg></div>' +
        '<p>' + t("carrito_vacio") + '</p>' +
        '<button class="btn btn-linea btn-sm" onclick="ir(\'catalogo\')">' + t("ver_catalogo") + '</button>' +
      '</div>';
    return;
  }

  var total = totalCarrito();
  var alcanza = total <= socio.saldo_tokens;
  var pedidosActivos = config.pedidos_activos !== "false";
  var notaPrevia = $("in-nota") ? $("in-nota").value : "";

  var html = carrito.map(function(i, idx){
    return '<div class="renglon">' +
             '<div class="info">' +
               '<h4>' + esc(i.nombre) + '</h4>' +
               '<div class="sub">' + t("cada_uno", num(i.precio_tokens)) + '</div>' +
               tokHTML(i.precio_tokens * i.cantidad) +
             '</div>' +
             '<div class="cant">' +
               '<button data-menos="' + idx + '">−</button>' +
               '<div class="n">' + i.cantidad + '</div>' +
               '<button data-mas="' + idx + '"' + (i.cantidad >= i.stock ? ' disabled' : '') + '>+</button>' +
             '</div>' +
           '</div>';
  }).join("");

  html += '<div class="cuenta">' +
            '<div class="linea"><span class="rotulo">' + t("saldo") + '</span>' + tokHTML(socio.saldo_tokens) + '</div>' +
            '<div class="linea total"><span class="rotulo">' + t("total") + '</span>' + tokHTML(total) + '</div>' +
          '</div>';

  if (!alcanza) html += '<div class="aviso err">' + t("faltan", num(total - socio.saldo_tokens)) + '</div>';
  else if (!pedidosActivos) html += '<div class="aviso avi">' + t("pedidos_pausados") + '</div>';
  else html += '<div class="aviso neu">' + t("quedaran", num(socio.saldo_tokens - total)) + '</div>';

  html += '<div class="campo" style="margin-top:6px">' +
            '<label for="in-nota">' + t("nota_label") + '</label>' +
            '<textarea id="in-nota" rows="2" placeholder="' + esc(t("nota_ph")) + '">' + esc(notaPrevia) + '</textarea>' +
          '</div>';

  html += '<button class="btn" id="btn-confirmar"' + (!alcanza || !pedidosActivos ? ' disabled' : '') + '>' +
            t("confirmar_pedido", num(total)) + '</button>';
  html += '<button class="btn btn-linea" style="margin:10px 0 30px" id="btn-vaciar">' + t("vaciar") + '</button>';

  cont.innerHTML = html;

  cont.querySelectorAll("[data-menos]").forEach(function(b){
    b.onclick = function(){ cambiarCantidad(Number(b.getAttribute("data-menos")), -1); };
  });
  cont.querySelectorAll("[data-mas]").forEach(function(b){
    b.onclick = function(){ cambiarCantidad(Number(b.getAttribute("data-mas")), 1); };
  });
  var bc = $("btn-confirmar"); if (bc) bc.onclick = confirmarPedido;
  $("btn-vaciar").onclick = function(){
    confirmar(t("vaciar_titulo"), t("vaciar_texto"), function(){
      carrito = []; actualizarContador(); pintarCarrito(); pintarProductos();
    });
  };
}

function cambiarCantidad(idx, delta){
  var i = carrito[idx];
  if (!i) return;
  i.cantidad += delta;
  if (i.cantidad < 1) carrito.splice(idx, 1);
  else if (i.cantidad > i.stock) i.cantidad = i.stock;
  actualizarContador();
  pintarCarrito();
  pintarProductos();
}


/* ==========================================================================
   CONFIRMAR PEDIDO
   La app manda solo qué productos y cuántos. TODO lo demás lo hace la base
   en una sola operación: busca los precios reales, verifica el stock, crea el
   pedido, descuenta los tokens y registra el movimiento.

   Que los precios los ponga la base y no el navegador es lo que impide que
   alguien edite el carrito para llevarse el catálogo por un token. Y que sea
   una sola operación es lo que garantiza que no quede un pedido a medias: si
   algo falla, no queda nada.
   ========================================================================== */
async function confirmarPedido(){
  if (procesando || !carrito.length) return;
  procesando = true;

  var btn = $("btn-confirmar");
  if (btn) { btn.disabled = true; btn.textContent = t("confirmando"); }

  try {
    var items = carrito.map(function(i){
      return { producto_id:i.producto_id, cantidad:i.cantidad };
    });

    var notaEl = $("in-nota");
    var r = await rpc("fn_socio_pedido", {
      p_token: TOKEN,
      p_items: items,
      p_nota: notaEl && notaEl.value.trim() ? notaEl.value.trim() : null
    });

    carrito = [];
    actualizarContador();
    if (notaEl) notaEl.value = "";

    await sincronizar();
    pintarColecciones();
    pintarProductos();

    $("exito-num").textContent = t("numero", nroPedido(r.id));
    $("exito-total").textContent = num(r.total);
    $("exito-saldo").textContent = num(socio.saldo_tokens);
    ir("exito");

  } catch(e){
    toast(e.message || t("err_confirmar"));
    try { await sincronizar(); } catch(e2){}
    pintarCarrito();
  } finally {
    procesando = false;
    /* El texto del botón lo repone pintarCarrito(), que lo arma con el total. */
    if (btn) btn.disabled = false;
  }
}


/* ==========================================================================
   MIS PEDIDOS
   ========================================================================== */
async function cargarPedidos(){
  var cont = $("pedidos-cont");
  cont.innerHTML = '<div class="cargando">' + t("cargando") + '</div>';

  var lista;
  try {
    await sincronizar();
    lista = pedidosCache;
  } catch(e){
    cont.innerHTML = '<div class="aviso err">' + t("err_pedidos") + '</div>';
    return;
  }

  if (!lista.length) {
    cont.innerHTML =
      '<div class="vacio">' +
        '<div class="ico"><svg width="26" height="26"><use href="#i-pedidos"/></svg></div>' +
        '<p>' + t("sin_pedidos") + '</p>' +
        '<button class="btn btn-linea btn-sm" onclick="ir(\'catalogo\')">' + t("ver_catalogo") + '</button>' +
      '</div>';
    return;
  }

  cont.innerHTML = lista.map(function(p){
    var items = Array.isArray(p.items) ? p.items : [];

    var filas = items.map(function(i){
      return '<div><span>' + i.cantidad + ' × ' + esc(i.nombre) + '</span>' +
             '<span class="cifra">' + num(i.subtotal) + '</span></div>';
    }).join("");

    var accion = p.estado === "pendiente"
      ? '<button class="btn btn-peligro btn-sm" data-cancelar="' + p.id + '">' + t("cancelar_pedido") + '</button>'
      : '';

    return '<div class="pedido">' +
             '<div class="cab">' +
               '<div>' +
                 '<div class="num">' + nroPedido(p.id) + '</div>' +
                 '<div class="fecha">' + fecha(p.created_at) + '</div>' +
               '</div>' +
               '<span class="marca-estado ' + (ESTADO_CLASE[p.estado] || "e-neu") + '">' +
                 etiquetaEstado(p.estado) + '</span>' +
             '</div>' +
             '<div class="items">' + filas + '</div>' +
             (p.nota ? '<div class="nota">' + esc(p.nota) + '</div>' : '') +
             '<div class="pie">' + tokHTML(p.total_tokens) + accion + '</div>' +
           '</div>';
  }).join("");

  cont.querySelectorAll("[data-cancelar]").forEach(function(b){
    b.onclick = function(){
      var id = Number(b.getAttribute("data-cancelar"));
      var p = lista.filter(function(x){ return x.id === id; })[0];
      confirmar(
        t("cancelar_titulo", nroPedido(id)),
        t("cancelar_texto", num(p.total_tokens)),
        function(){ cancelarPedido(p); }
      );
    };
  });
}

async function cancelarPedido(p){
  try {
    await rpc("fn_socio_pedido_cancelar", { p_token:TOKEN, p_pedido_id:p.id });
    await sincronizar();
    await cargarPedidos();
    pintarColecciones();
    pintarProductos();
    toast(t("cancelado_ok", num(p.total_tokens)));
  } catch(e){
    toast(e.message || t("err_cancelar"));
  }
}


/* ==========================================================================
   MIS TOKENS
   ========================================================================== */
async function cargarTokens(){
  await refrescarSocio();

  var cont = $("movs-cont");
  cont.innerHTML = '<div class="cargando" style="padding:24px 0">' + t("cargando") + '</div>';

  var movs = movsCache;
  if (!movs) {
    cont.innerHTML = '<div class="aviso err">' + t("err_movimientos") + '</div>';
    return;
  }

  if (!movs.length) {
    cont.innerHTML = '<div class="cargando" style="padding:24px 0">' + t("sin_movimientos") + '</div>';
    return;
  }

  cont.innerHTML = movs.map(function(m){
    var entra = m.cantidad >= 0;
    var clase = entra ? "mas" : "menos";

    /* La referencia se arma acá, en el idioma activo. En la base se guarda
       solo el id del pedido, no una frase: si se guardara el texto, quedaría
       congelado en el idioma en que se creó. */
    var ref = "";
    if (m.tipo === "consumo_pedido" || m.tipo === "devolucion_pedido") {
      if (m.referencia_id) ref = t("pedido_ref", nroPedido(m.referencia_id));
    } else if (m.referencia) {
      ref = m.referencia;
    }

    return '<div class="mov">' +
             '<div class="signo ' + clase + '">' + (entra ? "+" : "−") + '</div>' +
             '<div class="info">' +
               '<div class="q">' + t("m_" + m.tipo) + '</div>' +
               '<div class="f">' + fecha(m.created_at) + (ref ? " · " + esc(ref) : "") + '</div>' +
             '</div>' +
             '<div class="n ' + clase + '">' + (entra ? "+" : "−") + num(Math.abs(m.cantidad)) + '</div>' +
           '</div>';
  }).join("");
}

async function canjearCodigo(){
  var input = $("in-codigo");
  var msg = $("canje-msg");
  var codigo = input.value.trim().toUpperCase();
  msg.innerHTML = "";

  if (!codigo) { msg.innerHTML = '<div class="aviso avi">' + t("err_codigo_vacio") + '</div>'; return; }

  var btn = $("btn-canjear");
  btn.disabled = true;
  btn.textContent = t("canjeando");

  try {
    /* La base verifica que el código exista, que no esté usado y que no haya
       vencido, y acredita los tokens, todo en la misma operación. Dos personas
       no pueden canjear el mismo código al mismo tiempo. */
    var r = await rpc("fn_socio_canjear", { p_token:TOKEN, p_codigo:codigo });

    input.value = "";
    msg.innerHTML = '<div class="aviso ok">' + t("canje_ok", num(r.tokens)) + '</div>';
    await sincronizar();
    await cargarTokens();
    toast(t("canje_toast", num(r.tokens)));

  } catch(e){
    msg.innerHTML = '<div class="aviso err">' + esc(e.message || t("err_canje")) + '</div>';
  } finally {
    btn.disabled = false;
    btn.textContent = t("canjear");
  }
}


/* ==========================================================================
   ARRANQUE
   ========================================================================== */
$("btn-entrar").onclick = entrar;
$("btn-salir").onclick = salir;
$("btn-canjear").onclick = canjearCodigo;

$("in-pass").addEventListener("keydown", function(e){ if (e.key === "Enter") entrar(); });
$("in-usuario").addEventListener("keydown", function(e){ if (e.key === "Enter") $("in-pass").focus(); });
$("in-codigo").addEventListener("keydown", function(e){ if (e.key === "Enter") canjearCodigo(); });

window.addEventListener("load", async function(){

  if (!MODO_DEMO) $("cinta-demo").style.display = "none";

  /* Idioma guardado en este celular. Si no hay nada, arranca en español. */
  var guardadoIdioma = null;
  try { guardadoIdioma = localStorage.getItem(CLAVE_IDIOMA); } catch(e){}
  if (guardadoIdioma === "es" || guardadoIdioma === "en") IDIOMA = guardadoIdioma;

  $("h-club").textContent = CLUB_NOMBRE;
  aplicarIdioma();

  if (MODO_DEMO && $("login-ayuda")) $("login-ayuda").innerHTML = t("demo_ayuda");

  /* Si quedó una sesión abierta en esta pestaña, se prueba contra la base:
     si venció o el club dio de baja al socio, vuelve al login. */
  var guardado = null;
  try { guardado = sessionStorage.getItem(CLAVE_SESION); } catch(e){}

  if (guardado && !MODO_DEMO) {
    TOKEN = guardado;
    try {
      await abrirApp();
      return;
    } catch(e){
      TOKEN = null;
      try { sessionStorage.removeItem(CLAVE_SESION); } catch(e2){}
    }
  }

  $("in-usuario").focus();
});
</script>
